{% extends "base.html" %}
{% set editing = user and user.id is defined %}
{% block title %}{{ 'Edit' if editing else 'Register' }} user · User Portal{% endblock %}
{% block content %}
<h1>{{ 'Edit' if editing else 'Register' }} user</h1>
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ '/users/' ~ user.id ~ '/edit' if editing else '/users' }}" class="user-form">
  <label>First name*<input name="first_name" required maxlength="80" value="{{ user.first_name if user else '' }}"></label>
  <label>Last name*<input name="last_name" required maxlength="80" value="{{ user.last_name if user else '' }}"></label>
  <label>Email*<input name="email" type="email" required value="{{ user.email if user else '' }}"></label>
  <label>Department*<input name="department" required maxlength="100" value="{{ user.department if user else '' }}"></label>
  <label>Role*<input name="role" required maxlength="80" value="{{ user.role if user else '' }}"></label>
  <label>Employee ID<input name="employee_id" maxlength="50" value="{{ user.employee_id or '' if user else '' }}"></label>
  <label>Phone<input name="phone" maxlength="40" value="{{ user.phone or '' if user else '' }}"></label>
  <label class="checkbox"><input name="active" type="checkbox" value="true" {{ 'checked' if not user or user.active else '' }}> Active</label>
  <label class="wide">Comments<textarea name="comments" maxlength="1000">{{ user.comments or '' if user else '' }}</textarea></label>
  <div class="wide"><button type="submit">{{ 'Save changes' if editing else 'Register user' }}</button> <a href="/users">Cancel</a></div>
</form>
{% endblock %}
